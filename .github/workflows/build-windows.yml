name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Package application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ZipExtensionLoader --add-data "extension;extension" app/loader.py
          New-Item -ItemType Directory -Force publish | Out-Null
          Copy-Item dist/ZipExtensionLoader.exe publish/ZipExtensionLoader.exe -Force
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/ZipExtensionLoader.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: ZipExtensionLoader-Setup
          path: dist/ZipExtensionLoader-Setup.exe
